[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scorekeeper"
version = "0.1.0"
description = "An MCP scorekeeper with a web results dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx2>=2.7.0",
  "mcp>=1.20,<2",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
# LLM SDKs for the real judges (scorekeeper.metrics.judges). Optional so the
# metric taxonomy and its tests stay installable without any LLM SDK; the SDKs
# are imported lazily and only when a judge builds its own client.
judges = [
  "anthropic>=0.116,<1",
  "openai>=1.60,<3",
]

[project.scripts]
scorekeeper-mcp = "scorekeeper.server:main"
scorekeeper-api = "scorekeeper.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scorekeeper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"


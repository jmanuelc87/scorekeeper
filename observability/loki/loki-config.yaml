# Minimal single-binary Loki for local/compose use.
# Filesystem storage under /loki (backed by the loki_data volume); no auth.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Accept slightly out-of-order / delayed lines from the collector.
  reject_old_samples: false
  allow_structured_metadata: true

# No rules; disable the ruler's remote-write to keep the single binary quiet.
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false

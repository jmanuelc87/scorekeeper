services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scorekeeper
      POSTGRES_USER: scorekeeper
      POSTGRES_PASSWORD: scorekeeper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorekeeper -d scorekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    # Base settings (judge keys, etc.) come from .env; the values below override
    # the ones that must differ inside the Docker network (env wins over env_file).
    env_file: .env
    environment: &backend-environment
      DATABASE_URL: postgresql+psycopg://scorekeeper:scorekeeper@database:5432/scorekeeper
      MCP_TRANSPORT: http
    depends_on:
      database:
        condition: service_healthy

  mcp:
    build: .
    env_file: .env
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  api:
    build: .
    command: ["scorekeeper-api"]
    env_file: .env
    environment: *backend-environment
    healthcheck:
      # curl/wget aren't in the python:slim image, but Python always is.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8001"

  worker:
    build: .
    # Consumes the evaluation queue and runs the LLM scoring off the API's request
    # path. Broker is Postgres (kombu SQLAlchemy transport); no ports to expose.
    command:
      ["celery", "-A", "scorekeeper.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file: .env
    environment: *backend-environment
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # frontend:

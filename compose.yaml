services:
  database:
    # pgvector's image, not stock postgres: the schema has a ``vector`` column
    # (retrieved_document_embeddings) and ``CREATE EXTENSION vector`` needs vector.so,
    # which postgres:17-alpine does not ship. Same PG major, so the postgres_data volume
    # carries over; the base image does change from alpine to debian.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: scorekeeper
      POSTGRES_USER: scorekeeper
      POSTGRES_PASSWORD: scorekeeper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorekeeper -d scorekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: scorekeeper-engine
    # Two schemas, both created exactly once here: the application's (Alembic) and the
    # Celery broker's. The broker's matters because kombu creates its tables lazily on
    # first connect with a non-atomic check-then-create — three worker replicas booting
    # together race and all but one die on "duplicate key ... pg_class_relname_nsp_index".
    # Workers wait on this service completing, so by the time they connect there is
    # nothing left to create. See scorekeeper.broker.
    command: ["sh", "-c", "alembic upgrade head && scorekeeper-init-broker"]
    # Base settings (judge keys, etc.) come from .env; the values below override
    # the ones that must differ inside the Docker network (env wins over env_file).
    env_file: scorekeeper-engine/.env
    environment: &backend-environment
      DATABASE_URL: postgresql+asyncpg://scorekeeper:scorekeeper@database:5432/scorekeeper
    depends_on:
      database:
        condition: service_healthy

  api:
    build: scorekeeper-engine
    command: ["scorekeeper-api"]
    env_file: scorekeeper-engine/.env
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8001"

  worker:
    build: scorekeeper-engine
    # Consumes the evaluation queue and runs the LLM scoring off the API's request
    # path. Broker is Postgres (kombu SQLAlchemy transport); no ports to expose.
    command:
      ["celery", "-A", "scorekeeper.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=3"]
    env_file: scorekeeper-engine/.env
    environment: *backend-environment
    deploy:
      replicas: 3
    # A worker that dies on a transient boot failure (broker not reachable yet, a lost
    # database connection) should come back rather than leave the replica down.
    restart: on-failure
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # frontend:
  #   build:
  #     context: frontend
  #     args:
  #       VITE_API_URL: http://localhost:8001
  #   depends_on:
  #     - api
  #   ports:
  #     - "8080:80"

  # --- Observability: central log aggregation (Grafana Loki) --------------------

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  # Grafana Alloy collects every container's logs off the Docker socket, drops the
  # duplicated stderr text copy for the Python services, parses their stdout JSON,
  # and pushes to Loki. Reads the socket read-only; discovers containers by label.
  alloy:
    image: grafana/alloy:v1.7.1
    command:
      [
        "run",
        "/etc/alloy/config.alloy",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
      ]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      # Anonymous admin so the local UI works with no login prompt.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki

volumes:
  postgres_data:
  loki_data:
  alloy_data:
  grafana_data:

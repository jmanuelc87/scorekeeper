[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scorekeeper"
version = "0.1.0"
description = "A scorekeeper for AI assistant platform benchmarks with a web results dashboard"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.30,<1",
  "celery>=5.5,<6",
  "cryptography>=43,<49",
  "fastapi>=0.115,<1",
  "httpx2>=2.7.0",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  # Core, not an extra: db.models references the ``vector`` column type at module scope,
  # and that module is imported by every process (API, worker, Alembic env). The lazy
  # SDK-import convention used for the judge providers cannot apply to a column type.
  "pgvector>=0.3,<1",
  # The app itself talks to Postgres over asyncpg; psycopg stays because kombu's
  # SQLAlchemy broker transport is sync-only (see Settings.broker_url, which rewrites
  # the async DSN back to postgresql+psycopg for Celery). Not dead weight — don't drop it.
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  # The [asyncio] extra makes greenlet an unconditional dependency; without it greenlet
  # is only installed on a fixed set of platform markers, and any other platform fails
  # at the first query with MissingGreenlet.
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24,<26",
  "syntok>=1.4,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.11,<1",
]
# LLM SDKs for the real judges (scorekeeper.metrics.judges). Optional so the
# metric taxonomy and its tests stay installable without any LLM SDK; the SDKs
# are imported lazily and only when a judge builds its own client.
judges = [
  "anthropic>=0.116,<1",
  "openai>=1.60,<3",
]
# SharePoint client for the retrieval pipeline's certificate-based AuthProvider
# (scorekeeper.retrieval.credentials). Optional so the retrieval taxonomy and its
# tests stay installable without it; office365 is imported lazily and only when a
# SharePoint credential provider builds its authenticated ClientContext.
retrieval = [
  "Office365-REST-Python-Client>=2.5,<3",
  # Document → markdown for the extract stage (scorekeeper.retrieval.extract), imported
  # lazily. markitdown converts PDF/.docx/HTML; pypdf slices the target PDF page first.
  "markitdown[docx,pdf]>=0.1,<1",
  "pypdf>=5,<6",
]

[project.scripts]
scorekeeper-api = "scorekeeper.main:main"
# Pre-creates the SQLAlchemy broker's schema so concurrent workers do not race to
# create it; see scorekeeper.broker. No-op when CELERY_BROKER_URL points elsewhere.
scorekeeper-init-broker = "scorekeeper.broker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scorekeeper"]

[tool.pytest.ini_options]
# "tests" as well as "src": ``tests/seeded_prompts.py`` is a shared helper that reads the
# shipped prompt text out of the prompt-catalog migration, and several suites import it.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
# The suite drives an AsyncSession throughout, so async tests are the norm — "auto"
# saves decorating every one of them with @pytest.mark.asyncio.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"


<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Scorekeeper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Scorekeeper</h1>
      <nav>
        <a id="evaluations" href="#">Evaluaciones</a>
        <a id="options" href="#" title="Ajustes">Ajustes</a>
      </nav>
    </header>

    <p id="detection" class="notice">Leyendo la conversación…</p>

    <form id="form">
      <label>
        Lote
        <input id="runLabel" name="runLabel" autocomplete="off" list="runLabelList" />
        <!-- Filled from the batch names already in the run history, so several
             escenarios can be sent under one lote. -->
        <datalist id="runLabelList"></datalist>
        <small>Agrupa varios escenarios en una evaluación; déjalo vacío si no lo usas.</small>
      </label>
      <label>
        Escenario
        <input id="scenario" name="scenario" required autocomplete="off" list="scenarioList" />
        <!-- Filled from the scenario ids already in the run history, so the same id
             can be reused to compare another platform under one escenario. -->
        <datalist id="scenarioList"></datalist>
        <small>Reutiliza el mismo id para comparar varias plataformas en un escenario.</small>
      </label>
      <label>
        Plataforma
        <input id="platform" name="platform" required autocomplete="off" />
      </label>
      <label>
        Modelo
        <input id="model" name="model" autocomplete="off" />
        <small>Se detecta cuando el chat lo muestra; déjalo vacío si no lo sabes.</small>
      </label>
      <label>
        Caso de uso
        <input id="useCase" name="useCase" required autocomplete="off" />
        <small>Separa varios con comas para unir sus métricas.</small>
      </label>
      <!-- Blocked until a compatible chat with messages is confirmed; only the
           success path in `init()` enables it. -->
      <button id="submit" type="submit" disabled>Enviar a Scorekeeper</button>
    </form>

    <p id="error" class="notice error" hidden></p>

    <section id="run" hidden>
      <h2>Última evaluación</h2>
      <dl>
        <dt>Estado</dt>
        <dd><span id="runStatus" class="badge"></span></dd>
        <dt>Lote</dt>
        <dd id="runLabelValue">—</dd>
        <dt>Escenario</dt>
        <dd id="runScenario"></dd>
        <dt>Modelo</dt>
        <dd id="runModel">—</dd>
        <dt>Avance</dt>
        <dd id="runProgress">—</dd>
        <dt>Promedio</dt>
        <dd id="runAverage">—</dd>
      </dl>
      <p id="runError" class="notice error" hidden></p>
      <p class="run-id">
        <code id="runId"></code>
        <button id="refresh" type="button" class="link">Actualizar</button>
      </p>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
